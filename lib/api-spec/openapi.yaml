openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: crop
    description: Crop health analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /crop/analyze:
    post:
      operationId: analyzeCrop
      tags: [crop]
      summary: Analyze a crop image
      description: Sends a user-consented crop image to the configured vision provider and returns an uncertainty-aware crop health assessment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CropAnalysisInput"
      responses:
        "200":
          description: Crop analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CropAnalysisResult"
        "400":
          description: Invalid image or request
        "503":
          description: Vision provider unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CropAnalysisInput:
      type: object
      required: [imageBase64, mimeType, language]
      properties:
        imageBase64:
          type: string
          minLength: 100
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        language:
          type: string
          enum: [hi, en, braj]
        quality:
          type: object
          properties:
            brightness:
              type: number
            blurScore:
              type: number
            sharpness:
              type: number
          additionalProperties: false
    CropAnalysisResult:
      type: object
      required: [status, confidence, severity, yieldImpact, summary, treatment, reasoning, analysisMode]
      properties:
        status:
          type: string
          enum: [reliable, uncertain]
        disease:
          type: ["string", "null"]
        commonName:
          type: ["string", "null"]
        scientificName:
          type: ["string", "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        severity:
          type: string
          enum: [healthy, low, moderate, high, unknown]
        yieldImpact:
          type: object
          required: [minPercent, maxPercent]
          properties:
            minPercent:
              type: number
            maxPercent:
              type: number
          additionalProperties: false
        summary:
          type: string
        treatment:
          type: array
          items:
            type: string
        reasoning:
          type: string
        analysisMode:
          type: string
          enum: [gemini-vision, offline-quality-check]

